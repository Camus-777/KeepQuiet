name: Windows tests
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  tests:
    runs-on: windows-latest
    timeout-minutes: 20
    env:
      QT_QPA_PLATFORM: offscreen
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          architecture: x64
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install pinned dependencies
        run: python -m pip install -e ".[dev]"
      - name: Verify bundled model files
        run: python -B -m keepquiet prepare
      - name: Run offline and simulated-device tests
        run: python -B -m pytest -q -p no:cacheprovider -k "not test_fast_registry_queries_avoid_spawning_powershell_on_windows"
