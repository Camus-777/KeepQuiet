[build-system]
requires = ["setuptools>=77.0.3"]
build-backend = "setuptools.build_meta"

[project]
name = "keepquiet"
version = "0.2.2"
license = "MIT"
license-files = ["LICENSE"]
description = "Windows target-speaker microphone bridge for game voice chat"
requires-python = ">=3.12,<3.14"
dependencies = [
  "alkove==0.4.0",
  "numpy==2.5.4",
  "sounddevice==0.5.6",
  "PySide6-Essentials==6.12.0",
  "psutil==7.2.2",
]

[project.optional-dependencies]
dev = ["pytest==9.2.0", "pyinstaller==6.22.3", "markdown2==2.5.5"]

[project.scripts]
keepquiet = "keepquiet.cli:main"

[tool.setuptools.packages.find]
include = ["keepquiet*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: real model and audio fixture checks"]
